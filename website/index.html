<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Dark letters on light browser tabs, white letters on dark tabs. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Printing Galaxy" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142b4a" />
    <meta
      name="description"
      content="Printing Galaxy — notes printing, PVC cards, school ID cards, visiting cards, gifts and more. Order online in English or Hindi."
    />
    <title>Printing Galaxy — Print anything, delivered</title>
    <script>
      // Dark mode is disabled for now, so only the saved language is applied before first paint.
      try {
        var l = localStorage.getItem('pg-lang');
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
